---
- name: Ensure packages from OS-specific lists
  hosts: localhost
  connection: local
  gather_facts: yes

  tasks:
    - name: Determine distribution and OS family
      set_fact:
        distro: "{{ (ansible_facts['distribution'] | default(ansible_facts['os_family'])) | lower }}"

    - name: Load matching packages
      include_vars:
        file: "{{ playbook_dir }}/vars/{{ distro }}_packages.yml"

    - name: Show selected package manager and count
      debug:
        msg:
          - "OS family: {{ ansible_facts.os_family }}"
          - "Distribution: {{ ansible_facts.distribution | default('unknown') }}"
          - "Package manager: {{ ansible_pkg_mgr | default('unknown') }}"
          - "Packages to ensure: {{ packages | default([]) | length }}"

    - name: Ensure packages are present
      become: true
      package:
        name: "{{ packages }}"
        state: present
      when: packages is defined and packages | length > 0
      tags: install

    - name: Note about skipped items
      debug:
        msg: "This playbook only installs package-manager packages from the distribution-specific lists. casks, vscode extensions and go modules from the Brewfile are not handled."
